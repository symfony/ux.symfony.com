allow_url_include=off
display_errors=off
display_startup_errors=off
max_execution_time=30
session.use_strict_mode=On
realpath_cache_ttl=3600
zend.detect_unicode=Off
; The upload demos accept 1 MB per file: PHP refuses more before the application runs.
; A form sent without JavaScript carries 8 photos at most.
upload_max_filesize=1M
post_max_size=10M
max_file_uploads=10
